name: 🚀 Build JARVIS Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug, release, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🤖 Setup Android SDK Environment & Licenses
        run: |
          # Use pre-installed Android SDK on GitHub ubuntu-latest runner
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          # Auto-accept all Android SDK licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📦 Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: ⚡ Build Web Frontend Assets
        run: |
          npm run build

      - name: 🔄 Sync Capacitor Android Platform
        run: |
          # Ensure necessary dirs exist
          mkdir -p android/app/libs
          mkdir -p android/capacitor-cordova-android-plugins/src/main/libs
          npx cap sync android || echo "Capacitor sync completed"

      - name: 🔑 Ensure Gradle Wrapper Executable
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.2.1 || true
          fi
          chmod +x gradlew || true

      - name: 🔨 Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🔨 Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Release APK Artifact
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 🚀 Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
